name: Auto Publish Gold Price

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gold-price-publisher
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pillow beautifulsoup4 google-genai
      - name: Random delay
        run: sleep $((RANDOM % 1800))
      - name: Run Gold Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python gold_bot.py
